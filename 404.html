<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ұлан digital</title>
    <script>
        // /n/<id>/ сілтемесінің беті әлі жасалмаса – мақаланы басты беттен ашамыз
        (function () {
            var m = location.pathname.match(/^\/n\/([^\/?#]+)/);
            location.replace(m ? '/#news-' + m[1] : '/');
        })();
    </script>
    <style>body{font-family:system-ui,sans-serif;background:#F5F3FB;color:#1C1633;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}</style>
</head>
<body>
    <p><a href="/">«Ұлан» басты бетіне өту →</a></p>
</body>
</html>
